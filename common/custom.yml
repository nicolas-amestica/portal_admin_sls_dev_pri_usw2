shortRegion: ${self:custom.regions.siglas.${self:provider.region}}

regions:
  siglas:
    us-east-1: 'use1'
    us-east-2: 'use2'
    us-west-1: 'usw1'
    us-west-2: 'usw2'
    sa-east-1: 'sae1'

stage: ${opt:stage, self:provider.stage}

bucketDeployName: sls-deploys-${self:custom.stage}-pri-${self:custom.shortRegion}
usersTableName: users-${self:custom.stage}-pri-${self:custom.shortRegion}
configTableName: config-${self:custom.stage}-pri-${self:custom.shortRegion}

# API Gateway compartido (importado desde infrastructure)
apiGatewayId:
  Fn::ImportValue: portal-admin-${self:custom.stage}-api-id

apiGatewayUrl:
  Fn::ImportValue: portal-admin-${self:custom.stage}-api-url

serverless-offline:
  httpPort: 3200