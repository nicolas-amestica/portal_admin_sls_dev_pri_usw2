shortRegion: ${self:custom.regions.siglas.${self:provider.region}}

regions:
  siglas:
    us-east-1: 'use1'
    us-east-2: 'use2'
    us-west-1: 'usw1'
    us-west-2: 'usw2'
    sa-east-1: 'sae1'

stage: ${opt:stage, self:provider.stage}

# Ajustes transversales de costo/rendimiento por ambiente.
logRetentionInDays:
  dev: 7
  qa: 10
  prd: 30

xrayEnabled:
  dev: false
  qa: true
  prd: true

authorizerCacheTtlSeconds:
  dev: 30
  qa: 60
  prd: 120

bucketDeployName: sls-deploys-${self:custom.stage}-pri-${self:custom.shortRegion}
usersTableName: users-${self:custom.stage}-pri-${self:custom.shortRegion}
configTableName: config-${self:custom.stage}-pri-${self:custom.shortRegion}

# API Gateway compartido (importado desde infrastructure)
apiGatewayId:
  Fn::ImportValue: portal-admin-${self:custom.stage}-api-id

apiGatewayUrl:
  Fn::ImportValue: portal-admin-${self:custom.stage}-api-url

siiHosts:
  dev: maullin.sii.cl
  qa: maullin.sii.cl
  prd: palena.sii.cl
siiHost: ${self:custom.siiHosts.${self:custom.stage}}

# Partición única tabla accounting (ACC + uuid fijo por stage). Usar el mismo valor en scripts de migración.
accountingPartitionPk:
  dev: ACC#01900001-8007-7000-8000-000000000001
  qa: ACC#01900001-8007-7000-8000-000000000002
  prd: ACC#01900001-8007-7000-8000-000000000003

serverless-offline:
  httpPort: 3200