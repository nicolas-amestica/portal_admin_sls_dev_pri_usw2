Effect: Allow
Action:
  - dynamodb:DescribeTable
  - dynamodb:Query
  - dynamodb:Scan
  - dynamodb:GetItem
  - dynamodb:PutItem
  - dynamodb:UpdateItem
  - dynamodb:DeleteItem
Resource:
  - Fn::ImportValue: ${self:custom.stage}-usersArn
  - Fn::Join: ['/', [Fn::ImportValue: '${self:custom.stage}-usersArn', 'index', '*']]
