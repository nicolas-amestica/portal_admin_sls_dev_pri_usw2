Effect: Allow
Action:
  - dynamodb:DescribeTable
  - dynamodb:Query
  - dynamodb:Scan
  - dynamodb:GetItem
  - dynamodb:PutItem
  - dynamodb:UpdateItem
  - dynamodb:DeleteItem
Resource:
  - arn:aws:dynamodb:${self:provider.region}:*:table/users-${self:custom.stage}-pri-${self:custom.shortRegion}
  - arn:aws:dynamodb:${self:provider.region}:*:table/users-${self:custom.stage}-pri-${self:custom.shortRegion}/index/*