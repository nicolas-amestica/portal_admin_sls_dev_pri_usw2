service: configuracion
frameworkVersion: '3'

plugins:
  - serverless-bundle
  - serverless-offline

# Configuraciones para evitar alertas de la versión 3 del framework
disabledDeprecations: '*'
configValidationMode: off
projectDir: ./../../

custom: ${file(../../common/custom.yml)}

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-2'}
  profile: pa-${self:custom.stage}
  lambdaHashingVersion: 20201221
  endpointType: REGIONAL
  architecture: arm64

  environment:
    STAGE: ${self:custom.stage}
    DYNAMODB_CONFIG_TABLE: ${self:custom.configTableName}
    DYNAMODB_USER_TABLE: ${self:custom.usersTableName}
    PROFILE: ${self:provider.profile}
    NODE_OPTIONS: '--enable-source-maps'

  # Configurar seguimiento mediante aws x-ray
  tracing:
    apiGateway: true
    lambda: true

  # Repositorio en S3 para desplegar recursos
  deploymentBucket:
    name: ${self:custom.bucketDeployName}

  iamRoleStatements:
    - ${file(../../aws/policies/lambda-policy-xray.yml)}
    - ${file(../../aws/policies/lambda-policy-dynamodb-user.yml)}
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:Query
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.configTableName}

functions:
  update_global_config_v1:
    handler: handlers/update-global-config-v1.main
    description: Actualiza la configuración global del portal (solo Admin).
    timeout: 10
    events:
      - http:
          path: v1/configuracion/global
          method: post
          cors: true
          # authorizer: ${file(../../common/lambda-authorizer.yml)}

  update_user_config_v1:
    handler: handlers/update-user-config-v1.main
    description: Actualiza la configuración de usuario (idioma).
    timeout: 10
    events:
      - http:
          path: v1/configuracion/usuario
          method: post
          cors: true
          # authorizer: ${file(../../common/lambda-authorizer.yml)}

resources:
  - ${file(../../common/apigateway-errors.yml)}
  - ${file(../../common/dynamodb-config-table.yml)}
