service: configuracion-go
frameworkVersion: '4'

configValidationMode: warn

custom:
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-2'}

  # Nombres de tablas DynamoDB (ya existentes)
  configTableName: config-${self:custom.stage}-pri-usw2
  usersTableName: users-${self:custom.stage}-pri-usw2

  # Bucket de deployment
  bucketDeployName: sls-deploys-${self:custom.stage}-pri-usw2

provider:
  name: aws
  runtime: provided.al2023
  stage: ${self:custom.stage}
  region: ${self:custom.region}
  profile: pa-${self:custom.stage}
  lambdaHashingVersion: 20201221
  logRetentionInDays: ${self:custom.logRetentionInDays.${self:custom.stage}, 14}
  endpointType: REGIONAL
  architecture: arm64

  httpApi:
    id: 
      Fn::ImportValue: portal-admin-${self:custom.stage}-api-id

  environment:
    STAGE: ${self:custom.stage}
    DYNAMODB_CONFIG_TABLE: ${self:custom.configTableName}
    DYNAMODB_USER_TABLE: ${self:custom.usersTableName}
    PROFILE: ${self:provider.profile}

  # Configurar seguimiento mediante aws x-ray
  tracing:
    apiGateway: true
    lambda: true

  # Repositorio en S3 para desplegar recursos (usa bucket existente)
  deploymentBucket:
    name: ${self:custom.bucketDeployName}

  # Permisos IAM para acceder a DynamoDB y X-Ray
  iamRoleStatements:
    # X-Ray tracing
    - Effect: Allow
      Action:
        - xray:PutTraceSegments
        - xray:PutTelemetryRecords
      Resource: '*'

    # DynamoDB - Tabla de configuración
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:DescribeTable
      Resource:
        - arn:aws:dynamodb:${self:custom.region}:*:table/${self:custom.configTableName}
        - arn:aws:dynamodb:${self:custom.region}:*:table/${self:custom.configTableName}/*

    # DynamoDB - Tabla de usuarios (si se necesita en el futuro)
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:DescribeTable
      Resource:
        - arn:aws:dynamodb:${self:custom.region}:*:table/${self:custom.usersTableName}
        - arn:aws:dynamodb:${self:custom.region}:*:table/${self:custom.usersTableName}/*

package:
  individually: true
  patterns:
    - '!./**'

functions:
  get_global_config_v1:
    handler: bootstrap
    description: Obtiene la configuración global del portal (Go).
    timeout: 10
    memorySize: 256
    package:
      artifact: bin/get-global-config.zip
    events:
      - httpApi:
          path: /v1/configuracion/global
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  update_global_config_v1:
    handler: bootstrap
    description: Actualiza la configuración global del portal - solo Admin (Go).
    timeout: 10
    memorySize: 256
    package:
      artifact: bin/update-global-config.zip
    events:
      - httpApi:
          path: /v1/configuracion/global
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request


