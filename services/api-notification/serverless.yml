service: notificaciones
frameworkVersion: '4'

configValidationMode: warn

custom:
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-2'}
  shortRegion: usw2

  programTableName: programs-${self:custom.stage}-pri-${self:custom.shortRegion}
  bucketDeployName: sls-deploys-${self:custom.stage}-pri-${self:custom.shortRegion}

provider:
  name: aws
  runtime: provided.al2023
  stage: ${self:custom.stage}
  region: ${self:custom.region}
  profile: pa-${self:custom.stage}
  lambdaHashingVersion: 20201221
  architecture: arm64

  httpApi:
    id:
      Fn::ImportValue: portal-admin-${self:custom.stage}-api-id

  environment:
    STAGE: ${self:custom.stage}
    DYNAMODB_PROGRAM_TABLE: ${self:custom.programTableName}
    PROGRAM_TABLE: PRG#8e3d823d-9f58-45df-8a8f-6779435a0001
    EMAIL_CONFIG_SECRET_KEY: /pa/${self:custom.stage}/email-config
    BUCKET_INFO_GI: giras-indomito-${self:custom.stage}-info

  tracing:
    lambda: true

  deploymentBucket:
    name: ${self:custom.bucketDeployName}

  iamRoleStatements:
    # X-Ray tracing
    - Effect: Allow
      Action:
        - xray:PutTraceSegments
        - xray:PutTelemetryRecords
      Resource: '*'

    # DynamoDB — tabla de programas (solo lectura)
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:Query
      Resource:
        - arn:aws:dynamodb:${self:custom.region}:*:table/${self:custom.programTableName}

    # S3 — descarga de PDFs de contratos
    - Effect: Allow
      Action:
        - s3:GetObject
      Resource:
        - arn:aws:s3:::giras-indomito-${self:custom.stage}-info/*

    # SSM Parameter Store — credenciales SMTP
    - Effect: Allow
      Action:
        - ssm:GetParameter
      Resource:
        - arn:aws:ssm:${self:custom.region}:*:parameter/pa/${self:custom.stage}/email-config

    # KMS — descifrar parámetros SecureString en SSM
    - Effect: Allow
      Action:
        - kms:Decrypt
      Resource: '*'

package:
  individually: true
  patterns:
    - '!./**'

functions:
  send_notification_v1:
    handler: bootstrap
    description: Envía notificaciones por email con contrato adjunto (Go).
    timeout: 29
    memorySize: 512
    package:
      artifact: bin/send-notification.zip
    events:
      - httpApi:
          path: /v1/notificaciones
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request
