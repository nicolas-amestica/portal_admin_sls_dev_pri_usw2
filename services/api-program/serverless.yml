service: programas
frameworkVersion: '4'

configValidationMode: warn
projectDir: ./../../

plugins:
  - serverless-offline

custom: ${file(../../common/custom.yml)}

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    exclude:
      - 'aws-sdk'
      - '@aws-sdk/*'
    target: 'node20'
    platform: 'node'
    format: 'cjs'

package:
  individually: true

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-2'}
  profile: pa-${self:custom.stage}
  lambdaHashingVersion: 20201221

  # Usar API Gateway HTTP compartido
  httpApi:
    id: ${self:custom.apiGatewayId}

  architecture: arm64

  environment:
    STAGE: ${self:custom.stage}
    DYNAMODB_PROGRAM_TABLE: programs-${self:custom.stage}-pri-${self:custom.shortRegion}
    DYNAMODB_USER_TABLE: users-${self:custom.stage}-pri-${self:custom.shortRegion}
    DYNAMODB_MAINTAINER_TABLE: maintainer-${self:custom.stage}-pri-${self:custom.shortRegion}
    DYNAMODB_PK_MAINTAINER_TABLE: BNK#ACCOUNT
    DYNAMODB_PAYMENT_TABLE: payments-${self:custom.stage}-pri-${self:custom.shortRegion}
    PROGRAM_TABLE: PRG#8e3d823d-9f58-45df-8a8f-6779435a0001
    SECRET_KEY: /pa/${self:custom.stage}/jwt-key
    EMAIL_CONFIG_SECRET_KEY: /pa/${self:custom.stage}/email-config
    PROFILE: ${self:provider.profile}
    NODE_OPTIONS: '--enable-source-maps'
    BUCKET_INFO_GI: giras-indomito-${self:custom.stage}-info
    MEDICAL_FORM_TEMPLATE_S3_KEY: fichas-medicas/formato-base/ficha-medica-base.pdf

  # Configurar seguimiento mediante aws x-ray para identificar y resolver problemas y errores de rendimiento.
  tracing:
    lambda: true

  # Repositorio en S3 que se va a usar para desplegar los recursos en cloudFormation
  deploymentBucket:
    name: sls-deploys-${self:custom.stage}-pri-${self:custom.shortRegion}

  iamRoleStatements:
    - ${file(../../aws/policies/lambda-policy-xray.yml)}
    - ${file(../../aws/policies/lambda-policy-ssm.yml)}
    - ${file(../../aws/policies/lambda-policy-kms-ssm.yml)}
    - ${file(../../aws/policies/lambda-policy-dynamodb-program.yml)}
    - ${file(../../aws/policies/lambda-policy-dynamodb-user.yml)}
    - ${file(../../aws/policies/lambda-policy-dynamodb-maintainer.yml)}
    - ${file(../../aws/policies/lambda-policy-dynamodb-payment.yml)}
    - ${file(../../aws/policies/lambda-policy-s3.yml)}

functions:

  get_programs_v1:
    handler: functions/get-programs-view-v1.main
    description: Este recurso está relacionado con la obtención de la lista de programas en sistema.
    timeout: 29
    events:
      - httpApi:
          path: /v1/programas
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  get_program_v1:
    handler: functions/get-program-v1.main
    description: Este recurso está relacionado con la obtención de un programa en sistema por identificador único.
    timeout: 29
    events:
      - httpApi:
          path: /v1/programas/{programId}
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  create_program_v1:
    handler: functions/create-program-v1.main
    description: Creación de un programa.
    timeout: 29
    events:
      - httpApi:
          path: /v1/programas/crear
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  update_program_v1:
    handler: functions/update-program-v1.main
    description: Actualización de un programa.
    timeout: 29
    events:
      - httpApi:
          path: /v1/programas/actualizar
          method: PUT
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  complete_program_v1:
    handler: functions/complete-program-v1.main
    description: Este recurso está relacionado con la completación del programa en sistema por identificador único.
    timeout: 29
    events:
      - httpApi:
          path: /v1/programas/completar
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  reject_program_v1:
    handler: functions/reject-program-v1.main
    description: Este recurso está relacionado con el rechazo del programa en sistema por identificador único.
    timeout: 29
    events:
      - httpApi:
          path: /v1/programas/rechazar
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  approve_program_v1:
    handler: functions/approve-program-v1.main
    description: Aprueba el programa, crea cuenta con permiso de usuario, almacena en el pdf a S3, lo envía por correo.
    timeout: 29
    memorySize: 1024
    events:
      - httpApi:
          path: /v1/programas/aprobar
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  presign_signed_contract_upload_v1:
    handler: functions/presign-signed-contract-upload-v1.main
    description: URL prefirmada PUT para subir el PDF del contrato firmado sin base64 (S3 directo).
    timeout: 29
    events:
      - httpApi:
          path: /v1/programas/contratos-firmados/presign
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  confirm_program_v1:
    handler: functions/confirm-program-v1.main
    description: Confirma el programa generando el pdf.
    timeout: 29
    memorySize: 1024
    events:
      - httpApi:
          path: /v1/programas/confirmar
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  get_currency_rates_v1:
    handler: functions/get-currency-rates-v1.main
    description: Obtiene las tasas de cambio USD y BRL frente al peso chileno (CLP) en una sola llamada.
    timeout: 15
    events:
      - httpApi:
          path: /v1/programas/monedas/tasas
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  get_dashboard_v1:
    handler: functions/get-dashboard-v1.main
    description: Obtiene datos consolidados del panel de control (conteos, KPIs, próximos viajes, actividad reciente y cuentas bancarias).
    timeout: 29
    events:
      - httpApi:
          path: /v1/dashboard
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  get_analytics_v1:
    handler: functions/get-analytics-v1.main
    description: Obtiene estadísticas completas del periodo (viajes, cuotas, montos, programas) para el dashboard de analytics.
    timeout: 29
    events:
      - httpApi:
          path: /v1/analytics
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  save_passengers_v1:
    handler: functions/save-passengers-v1.main
    description: Guarda la nómina completa de pasajeros de un programa.
    timeout: 29
    events:
      - httpApi:
          path: /v1/pasajeros
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  get_passengers_v1:
    handler: functions/get-passengers-v1.main
    description: Retorna la nómina de pasajeros guardada para un programa.
    timeout: 29
    events:
      - httpApi:
          path: /v1/pasajeros
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  presign_passenger_medical_form_v1:
    handler: functions/presign-passenger-medical-form-v1.main
    description: URL prefirmada PUT para subir la ficha médica de un pasajero a S3.
    timeout: 29
    events:
      - httpApi:
          path: /v1/pasajeros/ficha-medica/presign
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  get_passenger_medical_form_url_v1:
    handler: functions/get-passenger-medical-form-url-v1.main
    description: URL prefirmada GET para descargar o visualizar la ficha médica de un pasajero.
    timeout: 29
    events:
      - httpApi:
          path: /v1/pasajeros/ficha-medica/url
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  get_passenger_medical_form_template_url_v1:
    handler: functions/get-passenger-medical-form-template-url-v1.main
    description: URL prefirmada GET para la plantilla PDF de ficha médica (bucket privado).
    timeout: 29
    events:
      - httpApi:
          path: /v1/pasajeros/ficha-medica/plantilla
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request
