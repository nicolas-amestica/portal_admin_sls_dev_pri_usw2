service: extracciones
frameworkVersion: '3'

disabledDeprecations: '*'
configValidationMode: off # Esta linea debe ser revisada para evitar el warning del projectDir, cuando eso quede solucionada se debe eliminar la linea actual
projectDir: ./../../

plugins:
  - serverless-bundle
  - serverless-offline

custom: ${file(../../common/custom.yml)}

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-2'}
  profile: pa-${self:custom.stage}
  lambdaHashingVersion: 20201221
  endpointType: REGIONAL

  environment:
    STAGE: ${self:custom.stage}
    DYNAMODB_PROGRAM_TABLE: programs-${self:custom.stage}-pri-${self:custom.shortRegion}
    DYNAMODB_USERS_TABLE: users-${self:custom.stage}-pri-${self:custom.shortRegion}
    PRG_TABLE_ID: PRG#8e3d823d-9f58-45df-8a8f-6779435a0001
    USR_TABLE_ID: USR#4f7cb502-4256-11ec-81d3-0242ac130003
    PER_TABLE_ID: PER#4f7cb502-4256-11ec-81d3-0242ac13000H
    SECRET_KEY: secret-pri-${self:custom.stage}-${self:custom.shortRegion}
    PROFILE: ${self:provider.profile}
    BUCKET: "giras-indomito-${self:custom.stage}-info"

  # Configurar seguimiento mediante aws x-ray para identificar y resolver problemas y errores de rendimiento.
  tracing:
    apiGateway: true
    lambda: true

  # Repositorio en S3 que se va a usar para desplegar los recursos en cloudFormation
  deploymentBucket:
    name: sls-deploys-${self:custom.stage}-pri-${self:custom.shortRegion}

  iamRoleStatements:
    - ${file(../../aws/policies/lambda-policy-xray.yml)}
    - ${file(../../aws/policies/lambda-policy-ssm.yml)}
    - ${file(../../aws/policies/lambda-policy-dynamodb-program.yml)}
    - ${file(../../aws/policies/lambda-policy-dynamodb-user.yml)}
    - ${file(../../aws/policies/lambda-policy-s3.yml)}

functions:
  excel_filedata_from_any_table_v1:
    handler: functions/excel_filedata-from-table-v1.main
    description: Este recurso está relacionado con la obtención de datos de cualquier tabla.
    timeout: 30
    events:
      - http:
          path: v1/extraccion/table/{pkName}
          method: get
          cors: true
          # authorizer: ${file(../../common/lambda-authorizer.yml)}

  downloadFile:
    handler: functions/get-object-s3-v1.main
    events:
      - http:
          path: v1/extracciones/object
          method: get
          # cors: true
          # authorizer: ${file(../../common/lambda-authorizer.yml)}

resources:
  - ${file(../../common/apigateway-errors.yml)}