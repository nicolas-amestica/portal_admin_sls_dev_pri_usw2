service: pagos
frameworkVersion: '4'

configValidationMode: warn
projectDir: ./../../

plugins:
  - serverless-offline

custom: ${file(../../common/custom.yml)}

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    exclude:
      - 'aws-sdk'
      - '@aws-sdk/*'
    target: 'node20'
    platform: 'node'
    format: 'cjs'

package:
  individually: true

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-2'}
  profile: pa-${self:custom.stage}
  lambdaHashingVersion: 20201221

  # Usar API Gateway HTTP compartido
  httpApi:
    id: ${self:custom.apiGatewayId}

  environment:
    STAGE: ${self:custom.stage}
    DYNAMODB_PAYMENT_TABLE: payments-${self:custom.stage}-pri-${self:custom.shortRegion}
    DYNAMODB_PROGRAM_TABLE: programs-${self:custom.stage}-pri-${self:custom.shortRegion}
    PROGRAM_TABLE: PRG#8e3d823d-9f58-45df-8a8f-6779435a0001
    DYNAMODB_USER_TABLE: users-${self:custom.stage}-pri-${self:custom.shortRegion}
    TRANSBANK_ENVIRONMENT: integration  # TODO: cambiar a 'production' en stage prd
    TRANSBANK_COMMERCE_CODE: ''         # TODO: commerce code de producción (solo requerido en prd)
    TRANSBANK_API_KEY_SECRET: /pa/${self:custom.stage}/transbank-api-key
    SECRET_KEY: /pa/${self:custom.stage}/jwt-key
    PROFILE: ${self:provider.profile}
    BUCKET_INFO_GI: giras-indomito-${self:custom.stage}-info
    EMAIL_CONFIG_SECRET_KEY: /pa/${self:custom.stage}/email-config

  # Configurar seguimiento mediante aws x-ray para identificar y resolver problemas y errores de rendimiento.
  tracing:
    lambda: true

  # Repositorio en S3 que se va a usar para desplegar los recursos en cloudFormation
  deploymentBucket:
    name: sls-deploys-${self:custom.stage}-pri-${self:custom.shortRegion}

  iamRoleStatements:
    - ${file(../../aws/policies/lambda-policy-xray.yml)}
    - ${file(../../aws/policies/lambda-policy-ssm.yml)}
    - ${file(../../aws/policies/lambda-policy-kms-ssm.yml)}
    - ${file(../../aws/policies/lambda-policy-cloudwatch.yml)}
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:BatchGetItem
        - dynamodb:BatchWriteItem
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_PAYMENT_TABLE}
        - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_PAYMENT_TABLE}/index/*
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:GetItem
        - dynamodb:UpdateItem
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_PROGRAM_TABLE}
        - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_PROGRAM_TABLE}/index/*
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:GetItem
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_USER_TABLE}
        - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_USER_TABLE}/index/*
    - Effect: Allow
      Action:
        - s3:PutObject
      Resource:
        - arn:aws:s3:::${self:provider.environment.BUCKET_INFO_GI}/comprobantes/*

functions:
  # Endpoints de pagos de cuotas
  get_active_programs_v1:
    handler: functions/get-active-programs-v1.main
    description: Obtener los programas activos del usuario autenticado.
    timeout: 29
    events:
      - httpApi:
          path: /v1/pagos/programas
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  get_installments_v1:
    handler: functions/get-installments-v1.main
    description: Obtener cuotas calculadas de un programa con su estado de pago.
    timeout: 29
    events:
      - httpApi:
          path: /v1/pagos/cuotas
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  create_installment_payment_v1:
    handler: functions/create-installment-payment-v1.main
    description: Crear un pago para una cuota específica de un programa.
    timeout: 29
    events:
      - httpApi:
          path: /v1/pagos/cuotas/crear
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  confirm_installment_payment_v1:
    handler: functions/confirm-installment-payment-v1.main
    description: Confirmar un pago de cuota después de la autorización de Transbank.
    timeout: 29
    events:
      - httpApi:
          path: /v1/pagos/cuotas/confirmar
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  get_payments_by_program_v1:
    handler: functions/get-payments-by-program-v1.main
    description: Obtener todos los pagos de un programa específico.
    timeout: 29
    events:
      - httpApi:
          path: /v1/pagos/programa
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  get_payments_by_user_v1:
    handler: functions/get-payments-by-user-v1.main
    description: Obtener todos los pagos de un usuario específico.
    timeout: 29
    events:
      - httpApi:
          path: /v1/pagos/usuario
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  cancel_installment_payment_v1:
    handler: functions/cancel-installment-payment-v1.main
    description: Cancelar un pago PENDING para una cuota específica.
    timeout: 29
    events:
      - httpApi:
          path: /v1/pagos/cuotas/cancelar
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  # Endpoints admin — asignación manual de cuotas (sii = false)
  get_programs_sii_false_v1:
    handler: functions/get-programs-sii-false-v1.main
    description: Obtener programas con sii=false para asignación manual de cuota.
    timeout: 29
    events:
      - httpApi:
          path: /v1/pagos/admin/programas-sin-sii
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  assign_installment_v1:
    handler: functions/assign-installment-v1.main
    description: Asignar una cuota manual a un programa con sii=false (cargo 10%).
    timeout: 29
    events:
      - httpApi:
          path: /v1/pagos/admin/asignar-cuota
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  register_cash_payment_v1:
    handler: functions/register-cash-payment-v1.main
    description: Registrar un pago en efectivo con comprobante para una cuota de programa sii=false.
    timeout: 29
    events:
      - httpApi:
          path: /v1/pagos/admin/registrar-pago-efectivo
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  # Endpoints legacy (mantener por compatibilidad)
  create_transaction_v1:
    handler: functions/create-transaction-v1.main
    description: Crear una transacción de pago con Transbank Webpay Plus (legacy).
    timeout: 29
    events:
      - httpApi:
          path: /v1/pagos/transacciones/crear
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  commit_transaction_v1:
    handler: functions/commit-transaction-v1.main
    description: Confirmar una transacción de pago con Transbank Webpay Plus (legacy).
    timeout: 29
    events:
      - httpApi:
          path: /v1/pagos/transacciones/confirmar
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  get_transaction_status_v1:
    handler: functions/get-transaction-status-v1.main
    description: Obtener el estado de una transacción de pago (legacy).
    timeout: 29
    events:
      - httpApi:
          path: /v1/pagos/transacciones/{token}/estado
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  get_transactions_v1:
    handler: functions/get-transactions-v1.main
    description: Listar todas las transacciones de pago (legacy).
    timeout: 29
    events:
      - httpApi:
          path: /v1/pagos/transacciones
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request
