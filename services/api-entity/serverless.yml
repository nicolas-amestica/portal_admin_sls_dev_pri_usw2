service: usuarios
frameworkVersion: '4'

configValidationMode: warn
projectDir: ./../../
useDotenv: true

plugins:
  - serverless-offline

custom: ${file(../../common/custom.yml)}

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    exclude:
      - 'aws-sdk'
      - '@aws-sdk/*'
    target: 'node20'
    platform: 'node'
    format: 'cjs'

package:
  individually: true

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-2'}
  profile: pa-${self:custom.stage}
  lambdaHashingVersion: 20201221
  logRetentionInDays: ${self:custom.logRetentionInDays.${self:custom.stage}, 14}

  # Usar API Gateway HTTP compartido
  httpApi:
    id: ${self:custom.apiGatewayId}

  environment:
    TOKEN_EXPIRATION: 86400000
    STAGE: ${self:custom.stage}
    PROFILE: ${self:provider.profile}
    URL_LOCAL: http://localhost:4200
    URL_DEV: https://d2q00w63koc9yz.cloudfront.net
    URL_PRD: https://d2e3zvke409odp.cloudfront.net
    SECRET_KEY: /pa/${self:custom.stage}/jwt-key
    DYNAMODB_USER_TABLE: users-${self:custom.stage}-pri-${self:custom.shortRegion}
    DYNAMODB_CONFIG_TABLE: config-${self:custom.stage}-pri-${self:custom.shortRegion}
    DYNAMODB_FAVORITES_TABLE: favorites-${self:custom.stage}-pri-${self:custom.shortRegion}
    EMAIL_CONFIG_SECRET_KEY: /pa/${self:custom.stage}/email-config
    GOOGLE_CLIENT_ID: 253565901316-95scqr8oip4rjfq29onrceqf2c0rer8a.apps.googleusercontent.com

  # Configurar seguimiento mediante aws x-ray para identificar y resolver problemas y errores de rendimiento.
  tracing:
    lambda: ${self:custom.xrayEnabled.${self:custom.stage}, true}

  # Repositorio en S3 que se va a usar para desplegar los recursos en cloudFormation
  deploymentBucket:
    name: sls-deploys-${self:custom.stage}-pri-${self:custom.shortRegion}

  iamRoleStatements:
    - ${file(../../aws/policies/lambda-policy-ssm.yml)}
    - ${file(../../aws/policies/lambda-policy-kms-ssm.yml)}
    - ${file(../../aws/policies/lambda-policy-xray.yml)}
    - ${file(../../aws/policies/lambda-policy-cloudwatch.yml)}
    - ${file(../../aws/policies/lambda-policy-dynamodb-user.yml)}
    - ${file(../../aws/policies/lambda-policy-dynamodb-config.yml)}
    - ${file(../../aws/policies/lambda-policy-dynamodb-favorites.yml)}

functions:

  login:
    handler: functions/login-v1.main
    events:
      - httpApi:
          path: /v1/sesiones/iniciar-sesion
          method: POST

  forgot_password_v1:
    handler: functions/forgot-password-v1.main
    description: Envía un correo electrónico con instrucciones para recuperar la contraseña.
    timeout: 29
    events:
      - httpApi:
          path: /v1/sesiones/recuperar-clave
          method: POST

  reset_password_v1:
    handler: functions/reset-password-v1.main
    description: Valida el token de recuperación y actualiza la contraseña del usuario.
    timeout: 29
    events:
      - httpApi:
          path: /v1/sesiones/restablecer-clave
          method: POST

  google_login_v1:
    handler: functions/google-login-v1.main
    description: Autentica un usuario mediante Google Identity Services y genera un JWT de la aplicación.
    timeout: 29
    events:
      - httpApi:
          path: /v1/sesiones/iniciar-sesion-google
          method: POST

  get_access_v1:
    handler: functions/get-access-v1.main
    description: Este recurso está relacionado con la obtención de los accesos de un usuario.
    timeout: 29
    events:
      - httpApi:
          path: /v1/iam/accesos/aplicaciones/GI/user
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  renew_session_v1:
    handler: functions/renew-session-v1.main
    description: Renueva el token JWT del usuario autenticado sin cerrar sesión.
    timeout: 29
    events:
      - httpApi:
          path: /v1/sesiones/renovar-sesion
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  update_profile_v1:
    handler: functions/update-profile-v1.main
    description: Actualiza los datos personales o la contraseña del usuario autenticado.
    timeout: 29
    events:
      - httpApi:
          path: /v1/usuarios/perfil
          method: PATCH
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  list_users_v1:
    handler: functions/list-users-v1.main
    description: Retorna todos los usuarios del sistema.
    timeout: 29
    events:
      - httpApi:
          path: /v1/usuarios
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  upsert_user_v1:
    handler: functions/upsert-user-v1.main
    description: Crea o actualiza un usuario del sistema.
    timeout: 29
    events:
      - httpApi:
          path: /v1/usuarios
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request
      - httpApi:
          path: /v1/usuarios
          method: PUT
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  toggle_user_status_v1:
    handler: functions/toggle-user-status-v1.main
    description: Activa o desactiva un usuario del sistema.
    timeout: 29
    events:
      - httpApi:
          path: /v1/usuarios/estado
          method: PATCH
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  list_profiles_v1:
    handler: functions/list-profiles-v1.main
    description: Retorna todos los perfiles IAM.
    timeout: 29
    events:
      - httpApi:
          path: /v1/iam/perfiles
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  upsert_profile_v1:
    handler: functions/upsert-profile-v1.main
    description: Crea o actualiza un perfil IAM.
    timeout: 29
    events:
      - httpApi:
          path: /v1/iam/perfiles
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request
      - httpApi:
          path: /v1/iam/perfiles
          method: PUT
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  delete_profile_v1:
    handler: functions/delete-profile-v1.main
    description: Elimina un perfil IAM y sus permisos asociados.
    timeout: 29
    events:
      - httpApi:
          path: /v1/iam/perfiles
          method: DELETE
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  list_modules_v1:
    handler: functions/list-modules-v1.main
    description: Retorna todos los módulos de la aplicación.
    timeout: 29
    events:
      - httpApi:
          path: /v1/iam/modulos
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  upsert_module_v1:
    handler: functions/upsert-module-v1.main
    description: Crea o actualiza un módulo de la aplicación.
    timeout: 29
    events:
      - httpApi:
          path: /v1/iam/modulos
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request
      - httpApi:
          path: /v1/iam/modulos
          method: PUT
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  delete_module_v1:
    handler: functions/delete-module-v1.main
    description: Elimina un módulo (y sus LV2 si es LV1).
    timeout: 29
    events:
      - httpApi:
          path: /v1/iam/modulos
          method: DELETE
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  get_user_iam_v1:
    handler: functions/get-user-iam-v1.main
    description: Retorna los perfiles asignados y permisos directos de un usuario.
    timeout: 29
    events:
      - httpApi:
          path: /v1/iam/usuarios/asignaciones
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  save_user_iam_v1:
    handler: functions/save-user-iam-v1.main
    description: Guarda los perfiles y permisos directos de un usuario.
    timeout: 29
    events:
      - httpApi:
          path: /v1/iam/usuarios/asignaciones
          method: PUT
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  create_user_v1:
    handler: functions/create-user-v1.main
    description: Crea un nuevo usuario en el portal con perfiles opcionales.
    timeout: 29
    events:
      - httpApi:
          path: /v1/iam/usuarios
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  list_auto_profile_rules_v1:
    handler: functions/list-auto-profile-rules-v1.main
    description: Retorna las reglas de asignación automática de perfil.
    timeout: 29
    events:
      - httpApi:
          path: /v1/iam/reglas-perfiles-auto
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  upsert_auto_profile_rule_v1:
    handler: functions/upsert-auto-profile-rule-v1.main
    description: Crea o actualiza una regla de perfil automático por trigger.
    timeout: 29
    events:
      - httpApi:
          path: /v1/iam/reglas-perfiles-auto
          method: PUT
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  get_profile_permissions_v1:
    handler: functions/get-profile-permissions-v1.main
    description: Retorna los módulos asignados a un perfil.
    timeout: 29
    events:
      - httpApi:
          path: /v1/iam/perfiles/permisos
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  save_profile_permissions_v1:
    handler: functions/save-profile-permissions-v1.main
    description: Guarda los módulos asignados a un perfil.
    timeout: 29
    events:
      - httpApi:
          path: /v1/iam/perfiles/permisos
          method: PUT
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request
