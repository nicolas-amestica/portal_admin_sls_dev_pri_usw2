service: contratos
frameworkVersion: '3'

disabledDeprecations: '*'
configValidationMode: off
projectDir: ./../../

plugins:
  - serverless-bundle
  - serverless-offline

custom: ${file(../../common/custom.yml)}

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-2'}
  profile: pa-${self:custom.stage}
  lambdaHashingVersion: 20201221
  endpointType: REGIONAL
  architecture: arm64
  apiGateway:
    binaryMediaTypes:
      - 'multipart/form-data'
      - 'image/*'
      - 'application/pdf'
      - '*/*'

  environment:
    STAGE: ${self:custom.stage}
    DYNAMODB_PROGRAM_TABLE: programs-${self:custom.stage}-pri-${self:custom.shortRegion}
    PROGRAM_TABLE: PRG#8e3d823d-9f58-45df-8a8f-6779435a0001
    SECRET_KEY: secret-pri-${self:custom.stage}-${self:custom.shortRegion}
    PROFILE: ${self:provider.profile}
    NODE_OPTIONS: '--enable-source-maps'
    BUCKET_INFO_GI: giras-indomito-${self:custom.stage}-info

  tracing:
    apiGateway: true
    lambda: true

  deploymentBucket:
    name: sls-deploys-${self:custom.stage}-pri-${self:custom.shortRegion}

  iamRoleStatements:
    - ${file(../../aws/policies/lambda-policy-xray.yml)}
    - ${file(../../aws/policies/lambda-policy-ssm.yml)}
    - ${file(../../aws/policies/lambda-policy-dynamodb-program.yml)}
    - ${file(../../aws/policies/lambda-policy-s3.yml)}

functions:
  management_program_v1:
    handler: functions/management-contract-v1.main
    description: Gestiona aprobación/rechazo de programas con contratos.
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: v1/contratos/solicitudes/contrato
          method: post
          cors: true
          # authorizer: ${file(../../common/lambda-authorizer.yml)}

  save_contract_data_v1:
    handler: functions/save-contract-data-v1.main
    description: Guarda la información del contrato en el programa.
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: v1/contratos/solicitudes/contratos
          method: post
          cors: true
          # authorizer: ${file(../../common/lambda-authorizer.yml)}

  build_contract_v1:
    handler: functions/build-pdf-document-v1.main
    description: Genera documentos en base64 y tipo "archivo" según tipo que se solicite.
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: v1/documentos/solicitudes/documento
          method: post
          cors: true
          # authorizer: ${file(../../common/lambda-authorizer.yml)}

  approve_contract_v1:
    handler: functions/approve-contract-v1.main
    description: Aprueba el contrato generado, genera pdf y lo almacena en S3.
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: v1/contratos/aprobar
          method: post
          cors: true
          # authorizer: ${file(../../common/lambda-authorizer.yml)}

resources:
  - ${file(../../common/apigateway-errors.yml)}