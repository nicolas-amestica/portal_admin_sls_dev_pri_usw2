service: contratos
frameworkVersion: '3'

disabledDeprecations: '*'
configValidationMode: off
projectDir: ./../../

plugins:
  - serverless-bundle
  - serverless-offline

custom: ${file(../../common/custom.yml)}

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-2'}
  profile: pa-${self:custom.stage}
  lambdaHashingVersion: 20201221
  endpointType: REGIONAL
  architecture: arm64
  apiGateway:
    binaryMediaTypes:
      - 'multipart/form-data'
      - 'image/*'
      - 'application/pdf'
      - '*/*'

  environment:
    STAGE: ${self:custom.stage}
    DYNAMODB_PROGRAM_TABLE: programs-${self:custom.stage}-pri-${self:custom.shortRegion}
    PROGRAM_TABLE: PRG#8e3d823d-9f58-45df-8a8f-6779435a0001
    SECRET_KEY: secret-pri-${self:custom.stage}-${self:custom.shortRegion}
    PROFILE: ${self:provider.profile}
    NODE_OPTIONS: '--enable-source-maps'
    BUCKET_INFO_GI: giras-indomito-${self:custom.stage}-info

  tracing:
    apiGateway: true
    lambda: true

  deploymentBucket:
    name: sls-deploys-${self:custom.stage}-pri-${self:custom.shortRegion}

  iamRoleStatements:
    - ${file(../../aws/policies/lambda-policy-xray.yml)}
    - ${file(../../aws/policies/lambda-policy-ssm.yml)}
    - ${file(../../aws/policies/lambda-policy-dynamodb-program.yml)}
    - ${file(../../aws/policies/lambda-policy-s3.yml)}

functions:
  save_contract_data_v1:
    handler: functions/save-contract-data-v1.main
    description: Guarda la información del contrato en el programa.
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: v1/contratos/guardar
          method: post
          cors: true
          # authorizer: ${file(../../common/lambda-authorizer.yml)}

  build_document_by_form_v1:
    handler: functions/build-pdf-document-by-form-v1.main
    description: Genera documentos en base64 desde un formulario.
    timeout: 30
    memorySize: 1024
    events:
      - http:
          path: v1/documentos/pdf
          method: post
          cors: true
          # authorizer: ${file(../../common/lambda-authorizer.yml)}

  get_pdf_document_by_sk_v1:
    handler: functions/get-pdf-document-by-sk-v1.main
    description: Obtiene el documento PDF en archivo a partir de su sk.
    timeout: 30
    memorySize: 1024
    events:
      - http:
          path: v1/documentos/pdf
          method: get
          cors: true
          # authorizer: ${file(../../common/lambda-authorizer.yml)}

  get_pdf_document_by_sk_from_program_v1:
    handler: functions/build-pdf-document-by-sk-from-program-v1.main
    description: Obtiene el documento PDF en base64 a partir de su sk desde el programa.
    timeout: 30
    memorySize: 1024
    events:
      - http:
          path: v1/documentos/pdf/{sk}
          method: get
          cors: true
          # authorizer: ${file(../../common/lambda-authorizer.yml)}

resources:
  - ${file(../../common/apigateway-errors.yml)}