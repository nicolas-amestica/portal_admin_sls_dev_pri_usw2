service: contratos
frameworkVersion: '4'

configValidationMode: warn
projectDir: ./../../

plugins:
  - serverless-offline

custom: ${file(../../common/custom.yml)}

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    exclude:
      - 'aws-sdk'
      - '@aws-sdk/*'
    target: 'node20'
    platform: 'node'
    format: 'cjs'

package:
  individually: true

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-2'}
  profile: pa-${self:custom.stage}
  lambdaHashingVersion: 20201221
  architecture: arm64

  # Usar API Gateway HTTP compartido
  httpApi:
    id: ${self:custom.apiGatewayId}
    # HTTP API maneja binary media types automáticamente mediante payload format 2.0

  environment:
    STAGE: ${self:custom.stage}
    DYNAMODB_PROGRAM_TABLE: programs-${self:custom.stage}-pri-${self:custom.shortRegion}
    PROGRAM_TABLE: PRG#8e3d823d-9f58-45df-8a8f-6779435a0001
    SECRET_KEY: secret-pri-${self:custom.stage}-${self:custom.shortRegion}
    PROFILE: ${self:provider.profile}
    NODE_OPTIONS: '--enable-source-maps'
    BUCKET_INFO_GI: giras-indomito-${self:custom.stage}-info

  tracing:
    lambda: true

  deploymentBucket:
    name: sls-deploys-${self:custom.stage}-pri-${self:custom.shortRegion}

  iamRoleStatements:
    - ${file(../../aws/policies/lambda-policy-xray.yml)}
    - ${file(../../aws/policies/lambda-policy-ssm.yml)}
    - ${file(../../aws/policies/lambda-policy-dynamodb-program.yml)}
    - ${file(../../aws/policies/lambda-policy-s3.yml)}

functions:
  save_contract_data_v1:
    handler: functions/save-contract-data-v1.main
    description: Guarda la información del contrato en el programa.
    timeout: 29
    memorySize: 512
    events:
      - httpApi:
          path: /v1/contratos/guardar
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  build_document_by_form_v1:
    handler: functions/build-pdf-contract-by-form-v1.main
    description: Genera contratos en base64 desde un formulario.
    timeout: 29
    memorySize: 1024
    events:
      - httpApi:
          path: /v1/contratos/pdf
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  get_pdf_contract_by_sk_v1:
    handler: functions/get-pdf-contract-by-sk-v1.main
    description: Obtiene el contrato PDF en archivo a partir de su sk.
    timeout: 29
    memorySize: 1024
    events:
      - httpApi:
          path: /v1/contratos/pdf
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  get_pdf_contract_by_sk_from_program_v1:
    handler: functions/build-pdf-contract-by-sk-from-program-v1.main
    description: Obtiene el contrato PDF en base64 a partir de su sk desde el programa.
    timeout: 29
    memorySize: 1024
    events:
      - httpApi:
          path: /v1/contratos/pdf/{sk}
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request