service: favoritos
frameworkVersion: '4'

configValidationMode: warn
projectDir: ./../../

plugins:
  - serverless-offline

custom: ${file(../../common/custom.yml)}

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    exclude:
      - 'aws-sdk'
      - '@aws-sdk/*'
    target: 'node20'
    platform: 'node'
    format: 'cjs'

package:
  individually: true

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-2'}
  profile: pa-${self:custom.stage}
  lambdaHashingVersion: 20201221

  httpApi:
    id: ${self:custom.apiGatewayId}

  architecture: arm64

  environment:
    STAGE: ${self:custom.stage}
    DYNAMODB_FAVORITES_TABLE: favorites-${self:custom.stage}-pri-${self:custom.shortRegion}
    SECRET_KEY: secret-pri-${self:custom.stage}-${self:custom.shortRegion}
    PROFILE: ${self:provider.profile}
    NODE_OPTIONS: '--enable-source-maps'

  tracing:
    lambda: true

  deploymentBucket:
    name: sls-deploys-${self:custom.stage}-pri-${self:custom.shortRegion}

  iamRoleStatements:
    - ${file(../../aws/policies/lambda-policy-xray.yml)}
    - ${file(../../aws/policies/lambda-policy-ssm.yml)}
    - ${file(../../aws/policies/lambda-policy-secretsmanager.yml)}
    - ${file(../../aws/policies/lambda-policy-dynamodb-favorites.yml)}

functions:

  get_favorites_v1:
    handler: functions/get-favorites-v1.main
    description: Obtiene la lista de favoritos de un usuario filtrados por ámbito (scope).
    timeout: 29
    events:
      - httpApi:
          path: /v1/favoritos/usuarios/{userId}
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  save_favorite_v1:
    handler: functions/save-favorite-v1.main
    description: Guarda un nuevo favorito para un usuario.
    timeout: 29
    events:
      - httpApi:
          path: /v1/favoritos
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  update_favorite_v1:
    handler: functions/update-favorite-v1.main
    description: Actualiza un favorito existente por su identificador.
    timeout: 29
    events:
      - httpApi:
          path: /v1/favoritos/{favoriteId}
          method: PUT
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  delete_favorite_v1:
    handler: functions/delete-favorite-v1.main
    description: Elimina un favorito por su identificador.
    timeout: 29
    events:
      - httpApi:
          path: /v1/favoritos/{favoriteId}
          method: DELETE
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

# Tabla DynamoDB de favoritos con GSI para lookup por favoriteId
resources:
  Resources:
    FavoritesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: favorites-${self:custom.stage}-pri-${self:custom.shortRegion}
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: false
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: gsiOne
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: gsiOne-index
            KeySchema:
              - AttributeName: gsiOne
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: false
