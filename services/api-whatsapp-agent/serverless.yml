service: agente-whatsapp
frameworkVersion: '4'

configValidationMode: warn
projectDir: ./../../

plugins:
  - serverless-offline

custom: ${file(../../common/custom.yml)}

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    exclude:
      - 'aws-sdk'
      - '@aws-sdk/*'
    target: 'node20'
    platform: 'node'
    format: 'cjs'

package:
  individually: true

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-2'}
  profile: pa-${self:custom.stage}
  lambdaHashingVersion: 20201221

  httpApi:
    id: ${self:custom.apiGatewayId}

  architecture: arm64

  websocketsApiName: inbox-ws-${self:custom.stage}-pri-${self:custom.shortRegion}
  websocketsDescription: WebSocket para notificaciones de inbox en tiempo real

  environment:
    STAGE: ${self:custom.stage}
    PROFILE: ${self:provider.profile}
    NODE_OPTIONS: '--enable-source-maps'
    TIMEZONE: America/Santiago
    WHATSAPP_SECRET_KEY: /pa/${self:custom.stage}/whatsapp-config
    GEMINI_SECRET_KEY: /pa/${self:custom.stage}/gemini-api-key
    GOOGLE_CALENDAR_OAUTH_SECRET_KEY: /pa/${self:custom.stage}/google-calendar-oauth
    GOOGLE_CALENDAR_ID: c_22d82dc32bd2255c8e0a5de671df98c7338ca03b8528c26c9e091ea79bf4118c@group.calendar.google.com
    CONVERSATIONS_TABLE: conversations-${self:custom.stage}-pri-${self:custom.shortRegion}
    BUCKET_INFO_GI: giras-indomito-${self:custom.stage}-info
    AGENT_LAMBDA_NAME: agente-whatsapp-${self:custom.stage}-ejecutar_agente_v1
    EMAIL_CONFIG_SECRET_KEY: /pa/${self:custom.stage}/email-config
    WHATSAPP_AGENT_EMAIL_CONFIG_SECRET_KEY: /pa/${self:custom.stage}/whatsapp-agent-email-config
    META_PAGE_SECRET_KEY: /pa/${self:custom.stage}/meta-page-config
    # Cambiar a 'true' para habilitar respuestas en Messenger e Instagram
    ENABLE_META_CHANNELS: 'true'
    ALERT_EMAIL: agente-whatsapp@work.girasindomito.cl
    CHATWOOT_BASE_URL: https://app.chatwoot.com
    CHATWOOT_ACCOUNT_ID: '159539'
    CHATWOOT_INBOX_ID: '105362'
    CHATWOOT_API_TOKEN_KEY: /pa/${self:custom.stage}/chatwoot-api-token
    WS_MANAGEMENT_ENDPOINT:
      Fn::Join:
        - ''
        - - 'https://'
          - Ref: WebsocketsApi
          - '.execute-api.'
          - Ref: 'AWS::Region'
          - '.amazonaws.com/${self:provider.stage}'

  tracing:
    lambda: true

  deploymentBucket:
    name: sls-deploys-${self:custom.stage}-pri-${self:custom.shortRegion}

  iamRoleStatements:
    - ${file(../../aws/policies/lambda-policy-xray.yml)}
    - ${file(../../aws/policies/lambda-policy-ssm.yml)}
    - ${file(../../aws/policies/lambda-policy-kms-ssm.yml)}
    - ${file(../../aws/policies/lambda-policy-s3.yml)}
    - ${file(../../aws/policies/lambda-policy-lambda.yml)}
    - Effect: Allow
      Action:
        - transcribe:StartTranscriptionJob
        - transcribe:GetTranscriptionJob
      Resource: '*'
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:*:table/conversations-${self:custom.stage}-pri-${self:custom.shortRegion}
        - arn:aws:dynamodb:${self:provider.region}:*:table/conversations-${self:custom.stage}-pri-${self:custom.shortRegion}/index/*
    - Effect: Allow
      Action:
        - execute-api:ManageConnections
      Resource:
        - arn:aws:execute-api:${self:provider.region}:*:*/@connections/*

functions:
  verificar_webhook_v1:
    handler: functions/verificacion-webhook-v1.main
    description: Verifica el handshake inicial de WhatsApp Cloud API (Meta).
    timeout: 10
    memorySize: 256
    events:
      - httpApi:
          path: /v1/whatsapp/webhook
          method: GET

  procesar_mensaje_v1:
    handler: functions/procesar-mensaje-v1.main
    description: Recibe mensajes entrantes de WhatsApp y delega al agente de forma asíncrona.
    timeout: 10
    memorySize: 256
    events:
      - httpApi:
          path: /v1/whatsapp/webhook
          method: POST

  ejecutar_agente_v1:
    handler: functions/ejecutar-agente-v1.main
    description: Orquesta la conversación con Gemini, ejecuta tools y envía la respuesta por WhatsApp.
    timeout: 60
    memorySize: 512

  responder_chatwoot_v1:
    handler: functions/responder-chatwoot-v1.main
    description: Recibe webhooks de Chatwoot y reenvía las respuestas del equipo al cliente por WhatsApp.
    timeout: 15
    memorySize: 256
    events:
      - httpApi:
          path: /v1/chatwoot/webhook
          method: POST

  listar_conversaciones_v1:
    handler: functions/listar-conversaciones-v1.main
    description: Lista las conversaciones abiertas derivadas al equipo humano en la bandeja de entrada.
    timeout: 15
    memorySize: 256
    events:
      - httpApi:
          path: /v1/inbox/conversaciones
          method: GET

  obtener_conversacion_v1:
    handler: functions/obtener-conversacion-v1.main
    description: Retorna el detalle de una conversación con el historial completo (Chatwoot + DynamoDB).
    timeout: 20
    memorySize: 256
    events:
      - httpApi:
          path: /v1/inbox/conversaciones/{chatwootId}
          method: GET

  responder_conversacion_v1:
    handler: functions/responder-conversacion-v1.main
    description: Envía una respuesta del equipo a través de Chatwoot hacia el cliente.
    timeout: 15
    memorySize: 256
    events:
      - httpApi:
          path: /v1/inbox/conversaciones/{chatwootId}/responder
          method: POST

  presign_adjunto_v1:
    handler: functions/presign-adjunto-v1.main
    description: Genera una URL prefirmada de S3 para que el frontend suba adjuntos directamente sin pasar por API Gateway.
    timeout: 5
    memorySize: 128
    events:
      - httpApi:
          path: /v1/inbox/adjuntos/presign
          method: POST

  adjuntar_archivo_v1:
    handler: functions/adjuntar-archivo-v1.main
    description: Descarga un adjunto desde S3 y lo envía al cliente vía WhatsApp Media API.
    timeout: 30
    memorySize: 256
    events:
      - httpApi:
          path: /v1/inbox/conversaciones/{chatwootId}/adjuntar
          method: POST

  ws_connect_v1:
    handler: functions/ws-connect-v1.main
    description: Registra una conexión WebSocket y asocia al admin con su conversación activa.
    timeout: 10
    memorySize: 128
    events:
      - websocket:
          route: $connect

  ws_disconnect_v1:
    handler: functions/ws-disconnect-v1.main
    description: Elimina la conexión WebSocket al desconectarse el admin.
    timeout: 10
    memorySize: 128
    events:
      - websocket:
          route: $disconnect

resources:
  Resources:
    ConversationsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: conversations-${self:custom.stage}-pri-${self:custom.shortRegion}
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
