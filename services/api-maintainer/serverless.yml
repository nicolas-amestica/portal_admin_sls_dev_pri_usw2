service: mantenedor
frameworkVersion: '4'

plugins:
  - serverless-offline

configValidationMode: warn
projectDir: ./../../

custom: ${file(../../common/custom.yml)}

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    exclude:
      - 'aws-sdk'
      - '@aws-sdk/*'
    target: 'node20'
    platform: 'node'
    format: 'cjs'

package:
  individually: true

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-2'}
  profile: pa-${self:custom.stage}
  lambdaHashingVersion: 20201221

  # Usar API Gateway HTTP compartido
  httpApi:
    id: ${self:custom.apiGatewayId}

  environment:
    STAGE: ${self:custom.stage}
    PROFILE: ${self:provider.profile}
    DYNAMODB_MAINTAINER_TABLE: maintainer-${self:custom.stage}-pri-${self:custom.shortRegion}
    DYNAMODB_PK_MAINTAINER_TABLE: BNK#ACCOUNT

  # Configurar seguimiento mediante aws x-ray para identificar y resolver problemas y errores de rendimiento.
  tracing:
    lambda: true

  # Repositorio en S3 que se va a usar para desplegar los recursos en cloudFormation
  deploymentBucket:
    name: sls-deploys-${self:custom.stage}-pri-${self:custom.shortRegion}

  iamRoleStatements:
    - ${file(../../aws/policies/lambda-policy-xray.yml)}
    - ${file(../../aws/policies/lambda-policy-ssm.yml)}
    - ${file(../../aws/policies/lambda-policy-kms-ssm.yml)}
    - ${file(../../aws/policies/lambda-policy-cloudwatch.yml)}
    - ${file(../../aws/policies/lambda-policy-dynamodb-maintainer.yml)}

functions:
  get_banks_v1:
    handler: functions/get-banks-v1.main
    description: Este recurso está relacionado con la obtención de los bancos de la empresa.
    timeout: 29
    events:
      - httpApi:
          path: /v1/mantenedor/bancos
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  get_catalog_items_v1:
    handler: functions/get-cost-items-v1.main
    description: Obtiene items activos de cualquier catálogo del mantenedor según su pk. Usado para autocompletado en formularios.
    timeout: 29
    events:
      - httpApi:
          path: /v1/mantenedor/catalogo
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  list_cost_items_admin_v1:
    handler: functions/list-cost-items-admin-v1.main
    description: Lista TODOS los items de un catálogo (activos e inactivos) para administración. Requiere rol administrador.
    timeout: 29
    events:
      - httpApi:
          path: /v1/mantenedor/items
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  create_cost_item_v1:
    handler: functions/create-cost-item-v1.main
    description: Crea un nuevo item en el catálogo del mantenedor.
    timeout: 29
    events:
      - httpApi:
          path: /v1/mantenedor/items
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  update_cost_item_v1:
    handler: functions/update-cost-item-v1.main
    description: Actualiza un item existente del catálogo del mantenedor (label, precio año actual, estado).
    timeout: 29
    events:
      - httpApi:
          path: /v1/mantenedor/items
          method: PUT
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  delete_cost_item_v1:
    handler: functions/delete-cost-item-v1.main
    description: Elimina permanentemente un item del catálogo del mantenedor.
    timeout: 29
    events:
      - httpApi:
          path: /v1/mantenedor/items
          method: DELETE
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  list_presenters_v1:
    handler: functions/list-presenters-v1.main
    description: Lista todos los presentadores del mantenedor (activos e inactivos). Usado por el formulario de reuniones y el módulo de configuración.
    timeout: 29
    events:
      - httpApi:
          path: /v1/mantenedor/presentadores
          method: GET
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  create_presenter_v1:
    handler: functions/create-presenter-v1.main
    description: Crea un nuevo presentador en el mantenedor.
    timeout: 29
    events:
      - httpApi:
          path: /v1/mantenedor/presentadores
          method: POST
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  update_presenter_v1:
    handler: functions/update-presenter-v1.main
    description: Actualiza un presentador existente del mantenedor.
    timeout: 29
    events:
      - httpApi:
          path: /v1/mantenedor/presentadores
          method: PUT
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request

  delete_presenter_v1:
    handler: functions/delete-presenter-v1.main
    description: Elimina permanentemente un presentador del mantenedor.
    timeout: 29
    events:
      - httpApi:
          path: /v1/mantenedor/presentadores
          method: DELETE
          authorizer:
            id: ${cf:autorizador-${self:custom.stage}.AuthorizerId}
            type: request