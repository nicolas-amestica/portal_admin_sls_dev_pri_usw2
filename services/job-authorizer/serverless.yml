service: autorizador
frameworkVersion: '4'

configValidationMode: warn
projectDir: ./../../

plugins:
  - serverless-offline

custom: ${file(../../common/custom.yml)}

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    exclude:
      - 'aws-sdk'
      - '@aws-sdk/*'
    target: 'node20'
    platform: 'node'
    format: 'cjs'

package:
  individually: true

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-2'}
  profile: pa-${self:custom.stage}
  lambdaHashingVersion: 20201221

  # Usar API Gateway HTTP compartido
  httpApi:
    id: ${self:custom.apiGatewayId}


  # Configurar seguimiento mediante AWS X-Ray para identificar y resolver problemas y errores de rendimiento
  tracing:
    lambda: true

  # Repositorio en S3 que se va a usar para desplegar los recursos en CloudFormation
  deploymentBucket:
    name: sls-deploys-${self:custom.stage}-pri-${self:custom.shortRegion}

  environment:
    STAGE: ${self:custom.stage}
    SECRET_KEY: secret-pri-${self:custom.stage}-${self:custom.shortRegion}
    PROFILE: ${self:provider.profile}

  iamRoleStatements:
    - ${file(../../aws/policies/lambda-policy-ssm.yml)}

functions:
  auth:
    handler: authorizer.authorize
    events:
      - httpApi:
          path: /v1/autorizador
          method: POST

  getToken:
    handler: authorizer.generateToken
    events:
      - httpApi:
          path: /v1/accesos
          method: POST

resources:
  Resources:
    HttpApiAuthorizer:
      Type: AWS::ApiGatewayV2::Authorizer
      Properties:
        ApiId: ${self:custom.apiGatewayId}
        AuthorizerType: REQUEST
        AuthorizerPayloadFormatVersion: '2.0'
        AuthorizerUri: 
          Fn::Join:
            - ''
            - - 'arn:aws:apigateway:'
              - Ref: AWS::Region
              - ':lambda:path/2015-03-31/functions/'
              - !GetAtt AuthLambdaFunction.Arn
              - '/invocations'
        IdentitySource:
          - '$request.header.Authorization'
        Name: ${self:custom.stage}-shared-authorizer
        AuthorizerResultTtlInSeconds: 0

    HttpApiAuthorizerPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt AuthLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: apigateway.amazonaws.com
        SourceArn: 
          Fn::Join:
            - ''
            - - 'arn:aws:execute-api:'
              - Ref: AWS::Region
              - ':'
              - Ref: AWS::AccountId
              - ':'
              - ${self:custom.apiGatewayId}
              - '/*/*/*'

  Outputs:
    authArn:
      Value: !GetAtt [AuthLambdaFunction, Arn]
      Export:
        Name: ${self:custom.stage}-authArn
    AuthorizerId:
      Value: !Ref HttpApiAuthorizer
      Export:
        Name: ${self:custom.stage}-AuthorizerId